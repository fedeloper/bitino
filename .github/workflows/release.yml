# Tag-triggered release: builds the three bitino_bench binaries (and the Android SDK archive) from the tagged
# tree and attaches them, with SHA256SUMS, to a draft GitHub release. The redistributable converted models
# (tools/release_models.py output) are attached by the maintainer; see docs/releasing.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: TARGETS=linux-x86_64 scripts/build_release.sh dist/bin
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-x86_64
          path: |
            dist/bin/bitino_bench-*
            dist/bin/BUILDINFO.txt

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang
      - run: TARGETS=linux-aarch64 scripts/build_release.sh dist/bin
      - name: Smoke test (correctness only)
        run: dist/bin/bitino_bench-linux-aarch64 --help || test $? -le 2
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-aarch64
          path: |
            dist/bin/bitino_bench-*
            dist/bin/BUILDINFO.txt

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: TARGETS="android-arm64 android-armv7" scripts/build_release.sh dist/bin
      - uses: actions/upload-artifact@v4
        with:
          name: bin-android-arm64
          path: |
            dist/bin/bitino_bench-*
            dist/bin/bitino-sdk-*
            dist/bin/BUILDINFO.txt

  release:
    needs: [linux-x86_64, linux-aarch64, android-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files and checksums
        run: |
          mkdir -p out
          for d in dist/bin-*; do
            cp "$d"/bitino_bench-* out/ 2>/dev/null || true
            cp "$d"/bitino-sdk-* out/ 2>/dev/null || true
            cat "$d/BUILDINFO.txt" >> out/BUILDINFO.txt
          done
          (cd out && sha256sum bitino_bench-* bitino-sdk-* > SHA256SUMS)
          cat out/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
