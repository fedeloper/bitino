<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bitino">
  <title>Bitino</title>
  <!-- A lowercase b drawn from bits: the stem is a column of three packed bits, the bowl is one more,
       and the single small square on the right is the "little bit" (un bitino). -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#b4432b"/>
  <rect x="16" y="12" width="8" height="8" rx="1.5" fill="#fff8f0"/>
  <rect x="16" y="23" width="8" height="8" rx="1.5" fill="#fff8f0"/>
  <rect x="16" y="34" width="8" height="18" rx="1.5" fill="#fff8f0"/>
  <path d="M24 34h10a9 9 0 0 1 0 18H24v-6h9a3 3 0 0 0 0-6h-9z" fill="#fff8f0"/>
  <rect x="44" y="16" width="6" height="6" rx="1.2" fill="#f2c14e"/>
</svg>
