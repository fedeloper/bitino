org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Library coordinates (Maven Central namespace io.github.fedeloper; see docs/android-deployment.md, "Publishing").
GROUP=io.github.fedeloper
POM_ARTIFACT_ID=bitino-android
VERSION_NAME=0.1.0

# Native build: ninja jobs per ABI (0 = ninja's default). Keeps peak memory bounded on small machines.
bitino.nativeJobs=0
